baseURL = "https://aiueokayu1219.github.io/"
languageCode = "ja"
title = "aiueokayu // blog"
theme = "macchiato"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.123.0"

paginate = 6
enableRobotsTXT = true

[params]
  author = "aiueokayu"
  favicon = "favicon.svg"
  wideLayout = true

  [params.prompt]
    user = "aiueokayu"
    host = "blog"
    path = "~"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 3

  [[menu.footer]]
    name = "Home"
    url = "/"
    weight = 1

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

